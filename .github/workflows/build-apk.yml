name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: إعداد Java (مطلوب لبناء أندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تنظيف أي نسخة قديمة من node_modules
        run: rm -rf node_modules

      - name: تثبيت الاعتماديات
        run: npm install

      - name: كتابة المتغيرات السرية (مفتاح Groq)
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: echo "EXPO_PUBLIC_GROQ_API_KEY=$GROQ_KEY" >> .env

      - name: توليد مجلد Android الأصلي
        run: npx expo prebuild --platform android --non-interactive

      - name: استعادة مفتاح التوقيع الرسمي
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: إعداد بيانات التوقيع لملف Gradle
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS_VAL" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=$KS_PASS" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASS" >> android/gradle.properties

      - name: تفعيل التوقيع الرسمي داخل build.gradle
        run: |
          sed -i "/signingConfigs {/a\\
              release {\\
                  storeFile file(MYAPP_RELEASE_STORE_FILE)\\
                  storePassword MYAPP_RELEASE_STORE_PASSWORD\\
                  keyAlias MYAPP_RELEASE_KEY_ALIAS\\
                  keyPassword MYAPP_RELEASE_KEY_PASSWORD\\
              }" android/app/build.gradle
          sed -i "s/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g" android/app/build.gradle

      - name: بناء ملف APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: رفع ملف APK كمخرج نهائي
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-signed
          path: android/app/build/outputs/apk/release/app-release.apk
